<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapToGrains Test - Dynamic</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #1a1a1a;
    color: white;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
}
button {
    background: #4CAF50;
    color: white;
    border: none;
    padding: 10px 15px;
    margin: 5px;
    border-radius: 5px;
    cursor: pointer;
}
button:disabled {
    background: #666;
}
.snapshot-btn {
    background: #FF9800;
}
.control-group {
    margin: 10px 0;
    padding: 10px;
    background: #2a2a2a;
    border-radius: 5px;
}
.file-input { margin: 10px 0; }
.status { margin: 20px 0; padding: 10px; background: #333; border-radius: 5px; }
.sequence-display {
    margin: 10px 0;
    padding: 10px;
    background: #222;
    border-radius: 5px;
    font-family: monospace;
    font-size: 12px;
}
.param-display {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin: 10px 0;
}
.param-item {
    background: #333;
    padding: 8px;
    border-radius: 3px;
    text-align: center;
}
.param-value {
    color: #4CAF50;
    font-weight: bold;
}
</style>
</head>
<body>

<h1>🎵 SnapToGrains - Dynamic Test</h1>

<div class="file-input">
    <input type="file" id="audioFile" accept="audio/*">
    <button id="loadBtn">Cargar Audio</button>
</div>

<div class="control-group">
    <h3>Snapshots de Prueba</h3>
    <div>
        <button class="snapshot-btn" data-snapshot="bright">🌞 Brillante</button>
        <button class="snapshot-btn" data-snapshot="dark">🌚 Oscuro</button>
        <button class="snapshot-btn" data-snapshot="contrast">⚫⚪ Contraste</button>
        <button class="snapshot-btn" data-snapshot="complex">🌀 Complejo</button>
        <button class="snapshot-btn" data-snapshot="smooth">🌊 Suave</button>
    </div>
    <div style="margin-top: 10px;">
        <input type="text" id="snapshotInput" placeholder="Texto personalizado" style="padding: 8px; width: 200px;">
        <button id="applyCustomBtn" disabled>Aplicar Custom</button>
    </div>
</div>

<div class="control-group">
    <h3>Control del Engine</h3>
    <button id="startBtn" disabled>▶️ Iniciar Engine</button>
    <button id="stopBtn" disabled>⏹️ Detener Engine</button>
</div>

<div class="sequence-display">
    <strong>Secuencia Actual:</strong> <span id="sequenceDisplay">-</span>
</div>

<div class="param-display" id="paramDisplay">
    <!-- Se llena dinámicamente -->
</div>

<div class="status" id="status">Selecciona un archivo de audio para comenzar</div>

<script type="module" src="main.js"></script>
</body>
</html>
