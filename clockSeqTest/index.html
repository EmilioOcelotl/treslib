<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clock + Sequencers</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      transition: background-color 0.3s ease;
      font-family: sans-serif;
    }

    svg {
      position: absolute;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    circle {
      fill: white;
      transition: r 0.3s ease;
    }

    #overlay {
      position: absolute;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      z-index: 10;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="overlay">Haz clic para iniciar</div>

  <svg>
    <circle id="circle" cx="50%" cy="50%" r="50" />
  </svg>

  <script type="module" src="main.js"></script>
</body>
</html>
